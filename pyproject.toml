[project]
name = "rakshak-backend"
version = "0.1.0"
description = "Project Rakshak - Enterprise-grade banking fraud intelligence platform"
authors = [
    { name = "Rakshak Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "redis>=5.0.7",
    "websockets>=12.0",
    "xgboost>=2.0.3",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "networkx>=3.3",
    "shap>=0.45.1",
    "structlog>=24.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "prometheus-client>=0.20.0",
    "slowapi>=0.1.9",
    "matplotlib>=3.9.0",
    "python-louvain>=0.16",
    "optuna>=3.6.1",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"


